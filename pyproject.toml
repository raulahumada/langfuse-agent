[project]
name = "langfuse-ops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langchain>=1.0",
  "langchain-mcp-adapters>=0.1.9",
  "langgraph>=1.0",
  "langfuse>=5.2.0",
  "python-dotenv>=1.2.4",
  "fastmcp>=3,<4",
  "langchain-openai>=1.8.1",
  "mcp>=1.24,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
